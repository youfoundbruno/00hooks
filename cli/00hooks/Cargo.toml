[package]
name = "hooks-cli"
description = "The 00hooks command: webhooks from anywhere, delivered to your own computer in real time."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "00hooks"
path = "src/main.rs"

[dependencies]
hooks-client = { path = "../hooks-client" }
hooks-runner = { path = "../hooks-runner" }
clap = { version = "4", features = ["derive", "env"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }

[dev-dependencies]
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "3"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
