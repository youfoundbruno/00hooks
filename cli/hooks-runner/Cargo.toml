[package]
name = "hooks-runner"
description = "The 00hooks automation runner: the event catalogue, automations, plain actions and run records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hooks-client = { path = "../hooks-client" }
base64 = "0.22"
dirs = "7"
getrandom = "0.3"
keyring = "4"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "sync"] }
url = "2"
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
