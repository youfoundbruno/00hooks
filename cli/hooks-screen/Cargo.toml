[package]
name = "hooks-screen"
description = "The 00hooks screen: rules, similarity fingerprints, field rules, an optional AI evaluator and the quarantine list, for everything that comes from outside."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hooks-client = { path = "../hooks-client" }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.13"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
