[workspace]
resolver = "3"
members = ["cli/hooks-client", "cli/hooks-runner", "cli/00hooks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/youfoundbruno/00hooks"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
